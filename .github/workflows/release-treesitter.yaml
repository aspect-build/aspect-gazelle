# Release + publish aspect_go_treesitter_grammars to the BCR, independently of the other
# modules (own treesitter-v* version line). Thin trigger over release-module.yaml; to
# add another module, copy this file with a new tag prefix / root / name (and
# add a release_prep.sh case + .bcr/<module>/ templates).
name: Release (treesitter)
on:
  push:
    tags:
      - 'treesitter-v*.*.*'
permissions:
  id-token: write
  attestations: write
  contents: write
jobs:
  release:
    uses: ./.github/workflows/release-module.yaml
    with:
      tag_prefix: "treesitter-v"
      module_root: "treesitter"
      module_name: "aspect_go_treesitter_grammars"
    secrets:
      BCR_PUBLISH_TOKEN: ${{ secrets.BCR_PUBLISH_TOKEN }}
