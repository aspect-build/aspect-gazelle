# Bazel downloader rewrite rules (--downloader_config).
#
# musl.libc.org is a single small origin with no CDN and frequently times out
# from CI runners, stalling the @llvm musl_libc repository fetch until the job
# is killed. Try mirrors first, then the upstream origin. The repository pins
# an integrity checksum, so a mirror cannot substitute different bytes.
rewrite musl\.libc\.org/releases/(.+) sources.buildroot.net/musl/$1
rewrite musl\.libc\.org/releases/(.+) sources.openwrt.org/$1
rewrite musl\.libc\.org/releases/(.+) musl.libc.org/releases/$1
